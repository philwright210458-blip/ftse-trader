# FTSE Exit Locks: can the scanner keep more of its earlier profits?
# (plan step 11, ftse_exit_lock_backtest.py). Run by hand (about an hour). Saves
# results/ftse_exit_locks.xlsx / .json / _trades.csv.

name: FTSE Exit Locks

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ftse-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packages
        run: pip install -r requirements.txt
      - name: Run backtest
        run: python -u ftse_exit_lock_backtest.py --out results/ftse_exit_locks.xlsx
      - name: Save results to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add results/ftse_exit_locks.xlsx results/ftse_exit_locks.json results/ftse_exit_locks_trades.csv
          if git diff --cached --quiet; then echo "Nothing new to save."; exit 0; fi
          git commit -m "Exit locks $(TZ=Europe/London date '+%Y-%m-%d %H:%M')"
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 15
          done
          exit 1
