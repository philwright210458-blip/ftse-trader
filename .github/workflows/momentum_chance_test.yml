# FTSE Momentum Chance Test: Claude's monthly momentum model against random portfolios under the same rules
# (plan step 6, ftse_momentum_chance.py). Run by hand. Saves results/ftse_momentum_chance.xlsx / .json;
# does not touch the live scans or the momentum paper trader.

name: FTSE Momentum Chance Test

on:
  workflow_dispatch:
    inputs:
      draws:
        description: "Random portfolios per variant"
        required: false
        default: "500"

permissions:
  contents: write

concurrency:
  group: ftse-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packages
        run: pip install -r requirements.txt
      - name: Run chance test
        env:
          DRAWS: ${{ inputs.draws }}
        run: python -u ftse_momentum_chance.py --draws "${DRAWS:-500}" --out results/ftse_momentum_chance.xlsx
      - name: Save results to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add results/ftse_momentum_chance.xlsx results/ftse_momentum_chance.json
          if git diff --cached --quiet; then echo "Nothing new to save."; exit 0; fi
          git commit -m "Momentum chance test $(TZ=Europe/London date '+%Y-%m-%d %H:%M')"
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 15
          done
          exit 1
