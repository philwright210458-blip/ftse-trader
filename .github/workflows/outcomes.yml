# FTSE Outcomes: scores past ideas and updates the mock trades. Started at 17:05
# UK time (Mon-Fri) by a cron-job.org timer. Safe to run by hand at any time: it
# only resolves ideas whose holding period has finished, and remembers what it
# has already done. It also updates the momentum paper trader (ftse_momentum_live.py).

name: FTSE Outcomes

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ftse-data
  cancel-in-progress: false

jobs:
  outcomes:
    runs-on: ubuntu-24.04   # pinned so the Ubuntu 26 switch (19 Oct 2026) cannot break it
    timeout-minutes: 30
    steps:
      # Check out the latest main, not the commit from when this run was requested:
      # runs queue behind each other, and an earlier run may have saved new results meanwhile.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run outcome tracker
        run: python -u ftse_outcomes.py

      # Re-check today's mock trades to the 16:30 close, so the scan workbook's
      # Today's Mock Trades sheet shows how open trades ended (the last scan is before the close).
      - name: Update today's mock trades to the close
        continue-on-error: true
        run: python -u ftse_trade_scanner.py --refresh-mock

      # Claude's monthly momentum model, paper-traded forward (ftse_momentum_live.py).
      # Decides after the close on the last trading day of each month and fills at the
      # next morning's open; catches up if a run is missed. A failure here never stops
      # the outcome tracker's results from being saved.
      - name: Update momentum paper trader
        continue-on-error: true
        run: python -u ftse_momentum_live.py

      # The daily structure pullback (idea 24), paper-traded from 22 Oct 2026 (ftse_structure_live.py).
      - name: Update structure pullback paper trader
        continue-on-error: true
        run: python -u ftse_structure_live.py

      # The day's FTSE 100 moves and the morning picker's scorecard (scan_data/daily_moves/<date>.csv),
      # read by the next morning's picker. Never stops the results above from being saved.
      - name: Save today's FTSE 100 moves
        continue-on-error: true
        run: python -u ftse_daily_moves.py

      - name: Save results to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add --all scan_data
          git add --all -- ftse_outcomes.xlsx 2>/dev/null || true
          git add --all -- ftse_scan_latest.xlsx 2>/dev/null || true
          git add --all -- ftse_momentum_live.xlsx 2>/dev/null || true
          git add --all -- ftse_structure_live.xlsx 2>/dev/null || true
          if git diff --cached --quiet; then echo "Nothing new to save."; exit 0; fi
          git commit -m "Outcomes $(TZ=Europe/London date '+%Y-%m-%d %H:%M')"
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 15
          done
          echo "::error::Could not save results to the repo after 3 attempts."
          exit 1
