# FTSE Stop/Target Backtest: replays the live mock trader on FTSE 100 shares over Yahoo's
# last ~60 days of 15-minute candles and compares stop distance, target distance and
# trade-size rules (see ftse_risk_backtest.py). Run it by hand from the Actions tab.
# It saves results/ftse_risk_backtest.xlsx and doesn't touch the live scan history.

name: FTSE Stop/Target Backtest

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Only the first N shares (leave blank for all)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: ftse-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run backtest
        env:
          LIMIT: ${{ inputs.limit }}
        run: |
          EXTRA=""
          if [ -n "$LIMIT" ]; then EXTRA="--limit $LIMIT"; fi
          python -u ftse_risk_backtest.py $EXTRA --out results/ftse_risk_backtest.xlsx

      - name: Save results to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add results/ftse_risk_backtest.xlsx
          if git diff --cached --quiet; then echo "Nothing new to save."; exit 0; fi
          git commit -m "Stop/target backtest $(TZ=Europe/London date '+%Y-%m-%d %H:%M')"
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 15
          done
          echo "::error::Could not save results to the repo after 3 attempts."
          exit 1
