# FTSE Structure Chance Test: the daily structure pullback's entries against random days (plan step 4a,
# ftse_structure_chance_backtest.py). Run by hand. Saves results/ftse_structure_chance.xlsx / .json / _trades.csv;
# does not touch the live scans or the structure paper trader.

name: FTSE Structure Chance Test

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Ignore prices before this date, YYYY-MM-DD"
        required: false
        default: "2006-10-21"

permissions:
  contents: write

concurrency:
  group: ftse-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packages
        run: pip install -r requirements.txt
      - name: Run chance test
        env:
          START: ${{ inputs.start }}
        run: python -u ftse_structure_chance_backtest.py --start "${START:-2006-10-21}" --out results/ftse_structure_chance.xlsx
      - name: Save results to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add results/ftse_structure_chance.xlsx results/ftse_structure_chance.json results/ftse_structure_chance_trades.csv
          if git diff --cached --quiet; then echo "Nothing new to save."; exit 0; fi
          git commit -m "Structure chance test $(TZ=Europe/London date '+%Y-%m-%d %H:%M')"
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 15
          done
          exit 1
