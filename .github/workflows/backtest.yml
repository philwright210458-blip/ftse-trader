# FTSE Backtest: replays the scanner over Yahoo's recent 15-minute history and
# scores the trades (see ftse_backtest.py). Run it by hand from the Actions tab.
# It takes roughly 15-30 minutes and saves results/ftse_backtest.xlsx to the repo.
# It doesn't touch the live scan history or the scheduled scans.

name: FTSE Backtest

on:
  workflow_dispatch:
    inputs:
      hold_days:
        description: "Longest hold per trade in trading days (1 = same day)"
        required: false
        default: "1"
      limit:
        description: "Only the first N shares (leave blank for all)"
        required: false
        default: ""
      index:
        description: "Only one index, e.g. FTSE 100 (leave blank for both)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: ftse-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run backtest
        env:
          LIMIT: ${{ inputs.limit }}
          HOLD: ${{ inputs.hold_days }}
          INDEX: ${{ inputs.index }}
        run: |
          if [ "$HOLD" = "1" ] || [ -z "$HOLD" ]; then OUT=results/ftse_backtest.xlsx; HOLD=1; else OUT="results/ftse_backtest_hold${HOLD}d.xlsx"; fi
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          EXTRA=""
          if [ -n "$LIMIT" ]; then EXTRA="--limit $LIMIT"; fi
          if [ -n "$INDEX" ]; then
            OUT="${OUT%.xlsx}_$(echo "$INDEX" | tr -d ' ' | tr 'A-Z' 'a-z').xlsx"
            echo "OUT=$OUT" >> "$GITHUB_ENV"
            python -u ftse_backtest.py --exclude-trusts --horizon "$HOLD" $EXTRA --index "$INDEX" --out "$OUT"
          else
            python -u ftse_backtest.py --exclude-trusts --horizon "$HOLD" $EXTRA --out "$OUT"
          fi

      - name: Make results downloadable
        uses: actions/upload-artifact@v4
        with:
          name: ftse-backtest-${{ inputs.hold_days }}d
          path: ${{ env.OUT }}

      - name: Save results to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add "$OUT"
          if git diff --cached --quiet; then echo "Nothing new to save."; exit 0; fi
          git commit -m "Backtest (hold up to ${{ inputs.hold_days }}d) $(TZ=Europe/London date '+%Y-%m-%d %H:%M')"
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 15
          done
          echo "::error::Could not save results to the repo after 3 attempts."
          exit 1
