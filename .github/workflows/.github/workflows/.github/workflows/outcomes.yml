# FTSE Outcomes: scores past ideas and updates the mock trades at 17:05 UK time,
# Monday to Friday. Safe to run by hand at any time: it only resolves ideas
# whose holding period has finished, and remembers what it has already done.

name: FTSE Outcomes

on:
  schedule:
    - cron: "5 16 * * 1-5"   # 17:05 UK in summer time (BST)
    - cron: "5 17 * * 1-5"   # 17:05 UK in winter time (GMT)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ftse-data
  cancel-in-progress: false

jobs:
  check-time:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        run: |
          now=$(TZ=Europe/London date +%H%M)
          echo "UK time now: $(TZ=Europe/London date '+%H:%M %Z')"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || { [ "$now" -ge 1700 ] && [ "$now" -lt 1800 ]; }; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not 17:xx UK time (this is the other half of the summer/winter pair), so skipping."
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

  outcomes:
    needs: check-time
    if: needs.check-time.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run outcome tracker
        run: python -u ftse_outcomes.py

      - name: Save results to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add --all scan_data
          git add --all -- ftse_outcomes.xlsx 2>/dev/null || true
          if git diff --cached --quiet; then echo "Nothing new to save."; exit 0; fi
          git commit -m "Outcomes $(TZ=Europe/London date '+%Y-%m-%d %H:%M')"
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 15
          done
          echo "::error::Could not save results to the repo after 3 attempts."
          exit 1

