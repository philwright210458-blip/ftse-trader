# FTSE Entry Check Backtest: the live trader with a fill check (skip trades whose stop is too close at
# the actual entry price) and a daily 50-day trend filter (see ftse_entry_check_backtest.py). Run it by
# hand from the Actions tab. It saves results/ftse_entry_check.xlsx and does not touch the live scan
# history.

name: FTSE Entry Check Backtest

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Only the first N shares (leave blank for all)"
        required: false
        default: ""
      test:
        description: "fill = fill check and trend filter; min-stop = minimum room to the stop at entry"
        required: false
        default: "fill"
        type: choice
        options: [fill, min-stop]

permissions:
  contents: write

concurrency:
  group: ftse-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run backtest
        env:
          LIMIT: ${{ inputs.limit }}
          TEST: ${{ inputs.test }}
        run: |
          EXTRA=""
          if [ -n "$LIMIT" ]; then EXTRA="--limit $LIMIT"; fi
          if [ "$TEST" = "min-stop" ]; then OUT=results/ftse_min_stop.xlsx; else TEST=fill; OUT=results/ftse_entry_check.xlsx; fi
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          python -u ftse_entry_check_backtest.py $EXTRA --test "$TEST" --out "$OUT"

      - name: Save results to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add "$OUT"
          if git diff --cached --quiet; then echo "Nothing new to save."; exit 0; fi
          git commit -m "Entry check backtest $(TZ=Europe/London date '+%Y-%m-%d %H:%M')"
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 15
          done
          echo "::error::Could not save results to the repo after 3 attempts."
          exit 1
