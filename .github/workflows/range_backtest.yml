# FTSE Range v2 Backtest: replays range model version 2 (Patrick Nill's method,
# rebuilt; see ftse_range_v2.py) on FTSE shares and the FTSE 100 index.
# Run it by hand from the Actions tab. It saves ftse_range_v2_backtest.xlsx to
# the repo and doesn't touch the live scans.

name: FTSE Range v2 Backtest

on:
  workflow_dispatch:
    inputs:
      hold_days:
        description: "Longest hold per trade in trading days"
        required: false
        default: "3"
      limit:
        description: "Only the first N shares (leave blank for all)"
        required: false
        default: ""
      interval:
        description: "Candle size: 15m (60 days of history) or 1h (about 2 years)"
        required: false
        default: "15m"
      index_only:
        description: "Test only the FTSE 100 index"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ftse-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run backtest
        env:
          LIMIT: ${{ inputs.limit }}
          HOLD: ${{ inputs.hold_days }}
          INTERVAL: ${{ inputs.interval }}
          INDEX_ONLY: ${{ inputs.index_only }}
        run: |
          if [ -z "$HOLD" ]; then HOLD=3; fi
          if [ -z "$INTERVAL" ]; then INTERVAL=15m; fi
          if [ "$INTERVAL" = "15m" ]; then PERIOD=60d; else PERIOD=729d; fi
          EXTRA=""
          OUT=ftse_range_v2_backtest
          if [ -n "$LIMIT" ]; then EXTRA="--limit $LIMIT"; fi
          if [ "$INDEX_ONLY" = "true" ]; then EXTRA="$EXTRA --index-only"; OUT="${OUT}_index"; fi
          if [ "$INTERVAL" != "15m" ]; then OUT="${OUT}_${INTERVAL}"; fi
          if [ "$HOLD" != "3" ]; then OUT="${OUT}_hold${HOLD}d"; fi
          OUT="${OUT}.xlsx"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          python -u ftse_range_backtest.py --exclude-trusts --interval "$INTERVAL" --period "$PERIOD" --horizon "$HOLD" $EXTRA --out "$OUT"

      - name: Make results downloadable
        uses: actions/upload-artifact@v4
        with:
          name: ftse-range-v2-backtest-${{ github.run_number }}
          path: ${{ env.OUT }}

      - name: Save results to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add "$OUT"
          if git diff --cached --quiet; then echo "Nothing new to save."; exit 0; fi
          git commit -m "Range v2 backtest $(TZ=Europe/London date '+%Y-%m-%d %H:%M')"
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 15
          done
          echo "::error::Could not save results to the repo after 3 attempts."
          exit 1
