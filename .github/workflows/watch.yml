# FTSE Watch: scans every share again (from 22 Oct 2026; it used to re-check only
# the 15 shares shortlisted at the full scan). Started every 15 minutes from 08:31
# to 15:31 UK time (Mon-Fri) by a cron-job.org timer.
#
# If two runs see the same 15-minute candle, the scanner notices there's no new
# candle and records nothing, so a doubled or late run does no harm.

name: FTSE Watch

on:
  workflow_dispatch:
    inputs:
      test:
        description: "Test run: scan every share but save nothing to the repo"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ftse-data
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04   # pinned so the Ubuntu 26 switch (19 Oct 2026) cannot break it
    timeout-minutes: 15
    env:
      TEST: ${{ inputs.test }}
    steps:
      # Check out the latest main, not the commit from when this run was requested:
      # runs queue behind each other, and an earlier run may have saved new results meanwhile.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run watch
        run: |
          set +e
          if [ "$TEST" = "true" ]; then
            echo "TEST RUN: results go to test_run/ and are not saved to the repo."
            python -u ftse_trade_scanner.py --watch --watch-top 0 --exclude-trusts --data-dir test_run --out test_run/ftse_watch_test.xlsx 2>&1 | tee run_output.txt
          else
            python -u ftse_trade_scanner.py --watch --watch-top 0 --exclude-trusts 2>&1 | tee run_output.txt
          fi
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ] && grep -q "No usable data came back" run_output.txt; then
            echo "::warning::No market data (market closed or Yahoo unavailable). Nothing recorded; this is not a fault."
            exit 0
          fi
          if [ "$code" -ne 0 ] && grep -q "No full scan found for today" run_output.txt; then
            echo "::error::No full scan found for today, so there's nothing to watch. Check the FTSE Full Scan run."
          fi
          exit $code

      - name: Save results to the repo
        if: env.TEST != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add --all scan_data
          git add --all -- ftse_scan_latest.xlsx 2>/dev/null || true
          if git diff --cached --quiet; then echo "Nothing new to save."; exit 0; fi
          git commit -m "Watch $(TZ=Europe/London date '+%Y-%m-%d %H:%M')"
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 15
          done
          echo "::error::Could not save results to the repo after 3 attempts."
          exit 1
