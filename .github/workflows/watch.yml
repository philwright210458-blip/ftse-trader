# FTSE Watch: re-checks the shortlist from today's full scan. Started every
# 15 minutes from 10:16 to 12:16 UK time (Mon-Fri) by a cron-job.org timer.
#
# If two runs see the same 15-minute candle, the scanner notices there's no new
# candle and records nothing, so a doubled or late run does no harm.

name: FTSE Watch

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ftse-data
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04   # pinned so the Ubuntu 26 switch (19 Oct 2026) cannot break it
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run watch
        run: |
          set +e
          python -u ftse_trade_scanner.py --watch --exclude-trusts 2>&1 | tee run_output.txt
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ] && grep -q "No usable data came back" run_output.txt; then
            echo "::warning::No market data (market closed or Yahoo unavailable). Nothing recorded; this is not a fault."
            exit 0
          fi
          if [ "$code" -ne 0 ] && grep -q "No full scan found for today" run_output.txt; then
            echo "::error::No full scan found for today, so there's nothing to watch. Check the FTSE Full Scan run."
          fi
          exit $code

      - name: Save results to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add --all scan_data
          git add --all -- ftse_scan_latest.xlsx 2>/dev/null || true
          if git diff --cached --quiet; then echo "Nothing new to save."; exit 0; fi
          git commit -m "Watch $(TZ=Europe/London date '+%Y-%m-%d %H:%M')"
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 15
          done
          echo "::error::Could not save results to the repo after 3 attempts."
          exit 1
