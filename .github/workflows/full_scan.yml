# FTSE Full Scan: the full scanner, started at 08:15 UK time (Mon-Fri) by a
# cron-job.org timer. GitHub's own scheduler proved too unreliable (runs
# started hours late or not at all), so this workflow only runs when started
# from outside or by hand.
#
# Manual runs ("Run workflow" button) are REAL full scans unless you tick
# "test", which scans only 10 shares, saves nothing to the repo, and makes the
# results downloadable from the run page.

name: FTSE Full Scan

on:
  workflow_dispatch:
    inputs:
      test:
        description: "Test run: scan only 10 shares and don't save anything to the repo"
        type: boolean
        default: false

permissions:
  contents: write

# All three workflows share this group, so they never save to the repo at the same time.
concurrency:
  group: ftse-data
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-24.04   # pinned so the Ubuntu 26 switch (19 Oct 2026) cannot break it
    timeout-minutes: 30
    env:
      TEST: ${{ inputs.test }}
    steps:
      # Check out the latest main, not the commit from when this run was requested:
      # runs queue behind each other, and an earlier run may have saved new results meanwhile.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run full scan
        run: |
          set +e
          if [ "$TEST" = "true" ]; then
            echo "TEST RUN: 10 shares only, results go to test_run/ and are not saved to the repo."
            python -u ftse_trade_scanner.py --exclude-trusts --limit 10 --data-dir test_run --out test_run/ftse_scan_test.xlsx 2>&1 | tee run_output.txt
          else
            python -u ftse_trade_scanner.py --exclude-trusts 2>&1 | tee run_output.txt
          fi
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ] && grep -q "No usable data came back" run_output.txt; then
            echo "::warning::No market data (market closed or Yahoo unavailable). Nothing recorded; this is not a fault."
            exit 0
          fi
          exit $code

      - name: Make test results downloadable
        if: env.TEST == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-scan-results
          path: test_run/
          if-no-files-found: warn

      - name: Save results to the repo
        if: env.TEST != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add --all scan_data
          git add --all -- ftse_scan_latest.xlsx 2>/dev/null || true
          if git diff --cached --quiet; then echo "Nothing new to save."; exit 0; fi
          git commit -m "Full scan $(TZ=Europe/London date '+%Y-%m-%d %H:%M')"
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 15
          done
          echo "::error::Could not save results to the repo after 3 attempts."
          exit 1
