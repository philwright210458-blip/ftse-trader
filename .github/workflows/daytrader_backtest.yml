# FTSE Day Trader Backtest: Phil's daily-context day trader on 5-minute candles,
# FTSE 100 shares, last 60 days (ftse_daytrader.py). Run by hand.
# Saves results/ftse_daytrader.xlsx; does not touch the live scans.

name: FTSE Day Trader Backtest

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ftse-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packages
        run: pip install -r requirements.txt
      - name: Run backtest
        run: |
          echo "OUT=results/ftse_daytrader.xlsx" >> "$GITHUB_ENV"
          python -u ftse_daytrader.py --out results/ftse_daytrader.xlsx
      - name: Save results to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add "$OUT"
          if git diff --cached --quiet; then echo "Nothing new to save."; exit 0; fi
          git commit -m "Day trader backtest $(TZ=Europe/London date '+%Y-%m-%d %H:%M')"
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 15
          done
          exit 1
