# FTSE Structure Pullback Backtest: idea 24 (Market Structure report), per £250 trade,
# 10 years of daily candles (ftse_structure_backtest.py). Run by hand.
# Saves results/ftse_structure_pullback_*.xlsx; does not touch the live scans.

name: FTSE Structure Pullback Backtest

on:
  workflow_dispatch:
    inputs:
      index:
        description: "FTSE 100, FTSE 250, or blank for both"
        required: false
        default: "FTSE 100"

permissions:
  contents: write

concurrency:
  group: ftse-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packages
        run: pip install -r requirements.txt
      - name: Run backtest
        env:
          INDEX: ${{ inputs.index }}
        run: |
          OUT="results/ftse_structure_pullback_$(echo "${INDEX:-all}" | tr -d ' ' | tr 'A-Z' 'a-z').xlsx"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          python -u ftse_structure_backtest.py --index "$INDEX" --out "$OUT"
      - name: Save results to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add "$OUT"
          if git diff --cached --quiet; then echo "Nothing new to save."; exit 0; fi
          git commit -m "Structure pullback backtest $(TZ=Europe/London date '+%Y-%m-%d %H:%M')"
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 15
          done
          exit 1
