# FTSE Trend Checks: does trading with the market, sector or trend pick out the scanner's better trades?
# (plan step 10, ftse_trend_filters_test.py). Run by hand. Uses existing trades; saves
# results/ftse_trend_filters.xlsx / .json / _trades.csv.

name: FTSE Trend Checks

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ftse-backtest
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packages
        run: pip install -r requirements.txt
      - name: Run checks
        run: python -u ftse_trend_filters_test.py --out results/ftse_trend_filters.xlsx
      - name: Save results to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add results/ftse_trend_filters.xlsx results/ftse_trend_filters.json results/ftse_trend_filters_trades.csv
          if git diff --cached --quiet; then echo "Nothing new to save."; exit 0; fi
          git commit -m "Trend checks $(TZ=Europe/London date '+%Y-%m-%d %H:%M')"
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 15
          done
          exit 1
