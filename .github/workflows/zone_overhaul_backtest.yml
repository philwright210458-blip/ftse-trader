# FTSE Zone Overhaul Backtest: fewer, stronger zones (plan step 2, idea 25; ftse_zone_overhaul_backtest.py).
# Five zone rules (A-E), one parallel job each (about an hour), then one job combines them with the chance test.
# Saves results/ftse_zone_overhaul.xlsx / .json / _trades.csv; does not touch the live scans. Run by hand.

name: FTSE Zone Overhaul Backtest

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Only the first N FTSE 100 shares (blank = all; use 5 for a quick test)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: ftse-zone-overhaul
  cancel-in-progress: false

jobs:
  variant:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        variant: [A, B, C, D, E]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packages
        run: pip install -r requirements.txt
      - name: Replay with zone rule ${{ matrix.variant }}
        env:
          LIMIT: ${{ inputs.limit }}
        run: |
          EXTRA=""
          if [ -n "$LIMIT" ]; then EXTRA="--limit $LIMIT"; fi
          python -u ftse_zone_overhaul_backtest.py --variant ${{ matrix.variant }} --out-dir zone_overhaul $EXTRA
      - uses: actions/upload-artifact@v4
        with:
          name: zone-overhaul-${{ matrix.variant }}
          path: zone_overhaul/variant_${{ matrix.variant }}.json
          retention-days: 14

  combine:
    needs: variant
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packages
        run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: zone-overhaul-*
          path: zone_overhaul
          merge-multiple: true
      - name: Combine and score
        run: python -u ftse_zone_overhaul_backtest.py --combine --out-dir zone_overhaul --out results/ftse_zone_overhaul.xlsx
      - name: Save results to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add results/ftse_zone_overhaul.xlsx results/ftse_zone_overhaul.json results/ftse_zone_overhaul_trades.csv
          if git diff --cached --quiet; then echo "Nothing new to save."; exit 0; fi
          git commit -m "Zone overhaul backtest $(TZ=Europe/London date '+%Y-%m-%d %H:%M')"
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 15
          done
          exit 1
